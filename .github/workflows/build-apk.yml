name: Build DeviceScope APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Check project structure
        run: |
          echo "===== Project root ====="
          ls -la

          echo "===== DeviceScopeFinal ====="
          ls -la DeviceScopeFinal

          echo "===== App directory ====="
          ls -la DeviceScopeFinal/app

          echo "===== Main directory ====="
          ls -la DeviceScopeFinal/app/src/main

      - name: Build DeviceScope APK
        run: |
          gradle -p DeviceScopeFinal assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeviceScope-debug-apk
          path: DeviceScopeFinal/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
