name: Build DeviceScope APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 获取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 配置 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. 配置 Gradle 8.11.1
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 4. 配置 Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 5. 接受 Android SDK License 并安装 API 36
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "===== Accept Android SDK licenses ====="
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "===== Update SDK manager ====="
          sdkmanager --update || true

          echo "===== Install required Android SDK packages ====="
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "===== Verify Android SDK ====="
          sdkmanager --list_installed | grep -E \
            "platforms;android-36|build-tools;36.0.0|platform-tools" || true

      # 6. 检查项目目录
      - name: Check project structure
        shell: bash
        run: |
          echo "===== Repository root ====="
          pwd
          ls -la

          echo "===== DeviceScopeFinal ====="
          ls -la DeviceScopeFinal

          echo "===== App directory ====="
          ls -la DeviceScopeFinal/app

          echo "===== Main directory ====="
          ls -la DeviceScopeFinal/app/src/main

          echo "===== Java directory ====="
          ls -la DeviceScopeFinal/app/src/main/java/com/devicescope/app

      # 7. 检查 Gradle 配置
      - name: Check Gradle project
        shell: bash
        run: |
          cd DeviceScopeFinal

          echo "===== settings.gradle ====="
          cat settings.gradle

          echo "===== build.gradle ====="
          cat build.gradle

          echo "===== app/build.gradle ====="
          cat app/build.gradle

      # 8. 编译 APK
      - name: Build DeviceScope APK
        shell: bash
        run: |
          cd DeviceScopeFinal

          echo "===== Gradle version ====="
          gradle --version

          echo "===== Clean project ====="
          gradle clean --no-daemon

          echo "===== Build Debug APK ====="
          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      # 9. 检查 APK 是否生成
      - name: Check APK
        shell: bash
        run: |
          echo "===== APK output ====="

          find DeviceScopeFinal/app/build/outputs \
            -type f \
            -name "*.apk" \
            -print

          if [ ! -f "DeviceScopeFinal/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          echo "APK generated successfully."

      # 10. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeviceScope-debug-apk
          path: DeviceScopeFinal/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
